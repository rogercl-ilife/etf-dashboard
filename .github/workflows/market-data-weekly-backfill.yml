name: ETF Market Data Weekly Backfill

on:
  schedule:
    - cron: '40 2 * * 0'
  workflow_dispatch:

jobs:
  backfill-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance python-dotenv supabase

      - name: Run weekly backfill
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python update_market_data.py --all-50 --period 5y
